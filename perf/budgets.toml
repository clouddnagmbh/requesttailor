# Performance budgets (product principle 4). They are release gates: exceeding one fails the build.
# Measured by scripts/perf/run.mjs (writes perf/results.json); checked by
# `node scripts/check-perf-budgets.mjs --require-all`, so a missing measurement fails as well.
# What each metric measures, and how: perf/README.md.

[metrics.cold_start]
description = "Desktop app cold start until the first interactive frame (median of 9 starts)"
unit = "ms"
max = 500

[metrics.idle_memory]
description = "Memory of the desktop app and its webview processes, idle, one collection open"
unit = "MB"
max = 150

[metrics.large_response_frame]
description = "p95 frame time while scrolling a 100 MB response body"
unit = "ms"
# Confirmed in wave 4 with an adjustment: the intent stays "no dropped frame at 60 Hz", but frame
# times are rAF intervals, which sit at 16.7 ms +- timer jitter in a perfectly smooth run (measured
# p95 16.8 ms), while a dropped frame shows as >= 33.3 ms. 20 ms separates the two: p95 <= 20 ms
# means at least 95 % of frames were on time. See perf/README.md.
max = 20

[metrics.send_keystrokes]
description = "Keystrokes from app start to a sent request (the last collection and request reopen)"
unit = "keys"
# "Under three keystrokes".
max = 2

[metrics.semantic_diff]
description = "Semantic diff of a collection with 1000 requests, 100 of them changed (median of 9, release build)"
unit = "ms"
# Wave 12: comparing two revisions must feel instant, also in a PR review of a large collection.
max = 200

# Wave 14, strand F (scripts/perf/graph.mjs, apps/web/e2e/perf/graph.measure.ts).
[metrics.git_graph]
description = "Commit graph of a repository with 10 000 commits: first rows visible after opening the history (median of 5, mock backend)"
unit = "ms"
max = 1500

[metrics.git_graph_frame]
description = "p95 frame time while scrolling that commit graph (wheel, jumps, PageDown; all pages load on the way)"
unit = "ms"
# Same reasoning as large_response_frame: 20 ms separates on-time frames from dropped ones.
max = 20

# Wave 14, strand H (scripts/perf/compare.mjs, apps/web/e2e/perf/compare.measure.ts).
[metrics.compare_view]
description = "Comparison of two revisions with 1000 requests, 100 changed, visible with both runs' answers (median of 5, mock backend)"
unit = "ms"
max = 1000

# Wave 15: the Git client for any repository. `pending` names the strand that builds the
# measurement; until it lands, a missing value does not fail `--require-all` (a measured value
# must still hold). The strand removes `pending` in the commit that adds the measurement.
# Strand C (scripts/perf/graph-large.mjs, crates/rt-git/examples/perf_graph.rs).
[metrics.git_graph_large]
description = "Commit graph of a repository with 100 000 commits: first page native (release rt-git) plus first rows visible (median of 5)"
unit = "ms"
max = 1500

# Strand B (scripts/perf/status.mjs, crates/rt-git/examples/perf_status.rs).
[metrics.git_status_large]
description = "Working copy of a repository with 50 000 tracked files, 100 changed: GitApi.workingCopy natively (release, warm, median of 9)"
unit = "ms"
max = 300

# Wave 17: Developer Delight. `pending` names the strand that builds the measurement; the
# strand removes it in the commit that adds the measurement (same rule as wave 15). The two
# thresholds marked "confirm" are estimates: the strand reports whether they hold after the
# first measurement.
# Strand B (scripts/perf/snapshots.mjs).
[metrics.snapshot_compare]
description = "Comparing 1000 stored responses (2 KB JSON, 20 ignored paths each, 100 differing) with their snapshots, JSON diff included: release rt-app, median of 9"
unit = "ms"
max = 150

# Strand C (scripts/perf/share.mjs, crates/rt-app/tests/share_perf.rs). First measurement: p95
# 1066 chars (median 450) over 228 requests, so the threshold of 2000 stands.
[metrics.share_url_size]
description = "Length of the share link of every request of the Bruno corpus, 95th percentile"
unit = "chars"
max = 2000

# Strand A (scripts/perf/observe.mjs, crates/rt-core/tests/observer_perf.rs). First measurement:
# 0.003 ms, so the threshold of 1 ms stands.
[metrics.observer_overhead]
description = "Time three do-nothing observers add to a send against rt-testserver: median difference to no observers over 500 sends"
unit = "ms"
max = 1

# Strand D (scripts/perf/watch.mjs, crates/rt-cli/tests/watch.rs).
[metrics.watch_resend]
description = "`rt send --watch`: from the file change to the request on the wire (a local server, release build, median of 9)"
unit = "ms"
max = 500

# Wave 18: Checking and Watching. `pending` names the strand that builds the measurement; the
# strand removes it in the commit that adds the measurement (same rule as waves 15 and 17).
# The thresholds are estimates: the strand reports whether they hold after the first measurement.
# Strand A (scripts/perf/envcompare.mjs).
[metrics.env_compare]
description = "Comparing 100 reading requests in 2 environments (fake transport, 100 differences): the run, the comparison of the steps and the result list, native release, median of 9"
unit = "ms"
max = 500

# Strand B (scripts/perf/checks.mjs).
[metrics.response_checks]
description = "Passive response checks (headers, cookies, CORS, tokens) on a 1 MiB response: Observation list, native release, median of 9"
unit = "ms"
pending = "wave 18, strand B"
max = 20

# Strand C (scripts/perf/paging.mjs).
[metrics.paging_merge]
description = "Following and merging 100 pages of 100 items (rt-testserver) into one stored response, median of 9"
unit = "ms"
pending = "wave 18, strand C"
max = 2500

# Strand D (scripts/perf/ratelimit.mjs).
[metrics.ratelimit_wait]
description = "Error of the wait before the next send when a response says Retry-After 1 s (rt run with --respect-limits), median of 9"
unit = "ms"
pending = "wave 18, strand D"
max = 50

# Strand E (scripts/perf/inbox.mjs).
[metrics.inbox_latency]
description = "Webhook inbox: from the request on the loopback port to the event in InboxApi.events, median of 100"
unit = "ms"
pending = "wave 18, strand E"
max = 50

# Strand F (scripts/perf/lint.mjs).
[metrics.lint_1000]
description = "rt lint on a collection with 1000 requests (native release, median of 9)"
unit = "ms"
max = 500

# Strand G (scripts/perf/views.mjs).
[metrics.view_apply]
description = "Applying a saved view (JSONPath) to a 10 MiB JSON response (native release, median of 9)"
unit = "ms"
pending = "wave 18, strand G"
max = 300

# Strand H (scripts/perf/schemas.mjs).
[metrics.schema_changes]
description = "Changes between two GraphQL schemas of 2000 types each (100 changed), rt-format release, median of 9"
unit = "ms"
pending = "wave 18, strand H"
max = 300

# Strand I (scripts/perf/catalogue.mjs).
[metrics.catalogue_index]
description = "Reading and checking a plugin index with 1000 entries (rt-app release, median of 9)"
unit = "ms"
pending = "wave 18, strand I"
max = 100

# Wave 19: Evidence and cleaning up. `pending` names the strand that builds the measurement; the
# strand removes it in the commit that adds the measurement. The thresholds are estimates: the
# strand reports whether they hold after the first measurement. Pro budgets are constants in
# the Pro tests (rule of wave 13).
# Strand A (scripts/perf/trace.mjs).
[metrics.trace_inject]
description = "The trace context on a request, `trace::inject` with and without an existing header (100 000 calls, release): median per call; 0 when off"
unit = "ms"
pending = "wave 19, strand A"
max = 0.02

# Strand B (scripts/perf/egress.mjs).
[metrics.egress_overhead]
description = "Time one egress call adds over the transport (fake transport, 100 allowed hosts, 1000 calls), median"
unit = "ms"
pending = "wave 19, strand B"
max = 1

# Strand C (scripts/perf/journal.mjs).
[metrics.journal_overhead]
description = "Time the journal adds to one writing send (10 000 entries into the channel), median; reading 5000 entries under 50 ms"
unit = "ms"
pending = "wave 19, strand C"
max = 1

# Strand D (scripts/perf/access.mjs).
[metrics.access_check]
description = "Own time of one two-user access check (fake transport, 200 checks, compare and evidence), median"
unit = "ms"
pending = "wave 19, strand D"
max = 10

# Strand E (scripts/perf/shrink.mjs).
[metrics.shrink_probes]
description = "Probes to shrink a 200-part request with one cause (at most 60) and 160 for three scattered causes; own time under 100 ms"
unit = "probes"
max = 60

# Strand F (scripts/perf/consumers.mjs).
[metrics.consumers_verify]
description = "Own time of verifying 20 local consumers of 50 requests each against rt-testserver, report and JSON included"
unit = "ms"
pending = "wave 19, strand F"
max = 1000

# Strand G (scripts/perf/sequence.mjs).
[metrics.sequence_render]
description = "Mermaid text 20 ms and SVG layout 100 ms for 500 messages; scroll p95 frame gap at most 20 ms on 2000 messages"
unit = "ms"
pending = "wave 19, strand G"
max = 100

# Strand R (scripts/perf/security.mjs).
[metrics.security_passive]
description = "All passive security rules on one response (headers, tokens, TLS info), native release, median"
unit = "ms"
pending = "wave 19, strand R"
max = 2

# Strand W (scripts/perf/notebook.mjs).
[metrics.notebook_open]
description = "Opening a notebook with 50 blocks: parse, render model and first paint, median of 9"
unit = "ms"
pending = "wave 19, strand W"
max = 300

# Strand Y (scripts/perf/debugger.mjs).
[metrics.debug_step]
description = "One step of the script debugger (pause to next pause, release), median of 100"
unit = "ms"
pending = "wave 19, strand Y"
max = 20
