# Performance budgets (product principle 4). They are release gates: exceeding one fails the build.
# Measured by scripts/perf/run.mjs (writes perf/results.json); checked by
# `node scripts/check-perf-budgets.mjs --require-all`, so a missing measurement fails as well.
# What each metric measures, and how: perf/README.md.

[metrics.cold_start]
description = "Desktop app cold start until the first interactive frame (median of 9 starts)"
unit = "ms"
max = 500

[metrics.idle_memory]
description = "Memory of the desktop app and its webview processes, idle, one collection open"
unit = "MB"
max = 150

[metrics.large_response_frame]
description = "p95 frame time while scrolling a 100 MB response body"
unit = "ms"
# Confirmed in wave 4 with an adjustment: the intent stays "no dropped frame at 60 Hz", but frame
# times are rAF intervals, which sit at 16.7 ms +- timer jitter in a perfectly smooth run (measured
# p95 16.8 ms), while a dropped frame shows as >= 33.3 ms. 20 ms separates the two: p95 <= 20 ms
# means at least 95 % of frames were on time. See perf/README.md.
max = 20

[metrics.send_keystrokes]
description = "Keystrokes from app start to a sent request (the last collection and request reopen)"
unit = "keys"
# "Under three keystrokes".
max = 2

[metrics.semantic_diff]
description = "Semantic diff of a collection with 1000 requests, 100 of them changed (median of 9, release build)"
unit = "ms"
# Wave 12: comparing two revisions must feel instant, also in a PR review of a large collection.
max = 200
