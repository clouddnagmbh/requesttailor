info:
  name: Batch (read and changeset)
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}{{service}}/$batch"
  headers:
    - name: Content-Type
      value: multipart/mixed; boundary=batch_rt
  body:
    type: text
    data: |-
      --batch_rt
      Content-Type: application/http
      Content-Transfer-Encoding: binary

      GET SalesOrder(SalesOrderUUID={{salesOrderUUID}},IsActiveEntity=true)?$expand=_Item HTTP/1.1
      Accept: application/json


      --batch_rt
      Content-Type: multipart/mixed; boundary=changeset_rt

      --changeset_rt
      Content-Type: application/http
      Content-Transfer-Encoding: binary
      Content-ID: 1

      POST SalesOrder HTTP/1.1
      Content-Type: application/json
      Accept: application/json

      {"CustomerID": "{{customerId}}", "Currency": "EUR"}
      --changeset_rt--

      --batch_rt--
  auth: inherit
