info:
  name: Batch (read and changeset)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}{{service}}/$batch"
  headers:
    - name: Content-Type
      value: multipart/mixed; boundary=batch_rt
  body:
    type: text
    data: |-
      --batch_rt
      Content-Type: application/http
      Content-Transfer-Encoding: binary

      GET Books({{bookId}}) HTTP/1.1
      Accept: application/json


      --batch_rt
      Content-Type: multipart/mixed; boundary=changeset_rt

      --changeset_rt
      Content-Type: application/http
      Content-Transfer-Encoding: binary

      POST Books HTTP/1.1
      Content-Type: application/json
      Accept: application/json

      {"ID": 912, "title": "Written in a changeset", "stock": 1}
      --changeset_rt--

      --batch_rt--
  auth: inherit
