info:
  name: Create book (new draft)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}{{service}}/Books"
  body:
    type: json
    data: |-
      {
        "ID": {{newBookId}},
        "title": "Notes from the Test Server",
        "author_ID": 170,
        "genre_ID": 10,
        "stock": 5,
        "price": 9.99,
        "currency_code": "EUR"
      }
  auth: inherit
