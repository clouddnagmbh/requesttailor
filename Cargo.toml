[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/desktop/src-tauri",
    "plugins/example",
    "plugins/odata",
    "plugins/soap",
    "plugins/sap-integration",
    "plugins/odata/testserver",
]
# CI canaries are standalone workspaces that must never join the real build.
exclude = ["ci"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# wasmi interprets the script engine (QuickJS) and plugins. Unoptimized it is far too slow for
# debug builds and tests (a trivial script would take seconds), so it is optimized there too.
[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_core]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_collections]
opt-level = 3
