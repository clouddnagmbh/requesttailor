info:
  name: List users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/{{apiVersion}}/users?page=1"
  params:
    - name: page
      value: "1"
      type: query

examples:
  - name: First page
    request:
      url: "{{baseUrl}}/{{apiVersion}}/users?page=1"
    response:
      status: 200
      body:
        type: json
        data: '[{"id": 42, "name": "Ada"}]'
  - name: Second page
    request:
      url: "{{baseUrl}}/{{apiVersion}}/users?page=2"
    response:
      status: 200
      body:
        type: json
        data: "[]"
