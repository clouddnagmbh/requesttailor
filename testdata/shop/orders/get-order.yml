info:
  name: Get order
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/{{apiVersion}}/orders/{orderId}"

examples:
  - name: As JSON
    request:
      headers:
        - name: Accept
          value: application/json
    response:
      status: 200
      body:
        type: json
        data: '{"id": "A-1"}'
  - name: As XML
    request:
      headers:
        - name: Accept
          value: application/xml
    response:
      status: 200
      body:
        type: xml
        data: <order id="A-1"/>
