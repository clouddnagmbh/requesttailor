syntax = "proto3";

package rt.common;

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_HIGH = 2;
}

message Metadata {
  map<string, string> entries = 1;
}
