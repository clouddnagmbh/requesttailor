info:
  name: unresolved
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/echo/unresolved"
  headers:
    - name: X-Missing
      value: "{{missingVar}}"
    - name: X-Disabled-Var
      value: "{{disabledVar}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
