info:
  name: secret
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/echo/secret?t={{apiToken}}"
  headers:
    - name: X-Token
      value: "{{apiToken}}"
  params:
    - name: t
      value: "{{apiToken}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
