info:
  name: secret
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/echo/assert-secret?t={{apiToken}}"
  params:
    - name: t
      value: "{{apiToken}}"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.body.query
      operator: eq
      value: "t={{apiToken}}"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.query
        method: jsonq
      variable:
        name: echoedQuery
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
