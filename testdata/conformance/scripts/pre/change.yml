info:
  name: change
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/echo/pre"
  headers:
    - name: X-From-Folder
      value: "{{fromFolder}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        rt.request.method = 'POST';
        rt.request.headers.set('X-Script', 'request');
        rt.request.body = JSON.stringify({ seen: rt.vars.get('fromFolder') });
        console.log('request', rt.vars.get('fromFolder'));
