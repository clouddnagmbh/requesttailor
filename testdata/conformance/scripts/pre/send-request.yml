info:
  name: send-request
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/echo/main"
  headers:
    - name: X-Side
      value: "{{sideMethod}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const side = await rt.sendRequest({
          url: rt.vars.replace('{{baseUrl}}/echo/side'),
          method: 'PUT',
          body: { a: 1 },
        });
        rt.vars.set('sideMethod', side.json().method);
