info:
  name: List orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/orders"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.count
      operator: isNumber
