// Synthetic Orders protocol, version 3: breaks version 1 in every way the rules name (written for RequestTailor tests, Apache-2.0).
syntax = "proto3";

package shop.orders;

import "common/money.proto";

service Orders {
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (Order);
  rpc Upload(stream Chunk) returns (UploadResult);
  rpc Cancel(CancelRequest) returns (Order);
}

message GetOrderRequest {
  string id = 1;
}

message ListOrdersRequest {
  int32 limit = 1;
  int32 customer = 2;
  string offset = 3;
}

message Order {
  string id = 2;
  shop.common.Money total = 1;
  Status status = 3;
  string tags = 4;
  string note = 5;
  oneof contact {
    string email = 6;
  }
  string phone = 7;
  int32 priority = 8;
  Customer customer = 10;
  map<string, string> labels = 11;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    OPEN = 1;
    CANCELLED = 3;
  }

  message Customer {
    string name = 1;
  }
}

message Chunk {
  bytes data = 1;
}

message UploadResult {
  int64 size = 1;
}

message WatchRequest {
  string customer = 1;
}

message CancelRequest {
  string id = 1;
}

