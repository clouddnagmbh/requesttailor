openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: X-Tenant
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read an order
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No such order.
    delete:
      summary: Delete an order
      responses:
        "204":
          description: Deleted.
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Alive.
components:
  schemas:
    Status:
      type: string
      enum: [open, shipped]
    Order:
      type: object
      required: [id, customer, total]
      properties:
        id:
          type: string
        customer:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        total:
          type: number
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/Line"
    Line:
      type: object
      required: [sku, qty]
      properties:
        sku:
          type: string
        qty:
          type: integer
    NewOrder:
      type: object
      required: [customer, items]
      properties:
        customer:
          type: string
        note:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Line"
