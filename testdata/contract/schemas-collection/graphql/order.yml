info:
  name: Get order
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  body:
    query: |-
      query ($id: ID!) {
        order(id: $id) {
          id
          total
          lines {
            qty
          }
        }
      }
    variables: |-
      {}
  auth: inherit
