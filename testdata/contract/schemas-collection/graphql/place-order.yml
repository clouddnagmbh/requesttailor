info:
  name: Place order
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  body:
    query: |-
      mutation ($input: NewOrder!) {
        placeOrder(input: $input) {
          id
        }
      }
    variables: |-
      {}
  auth: inherit
