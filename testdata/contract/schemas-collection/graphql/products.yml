info:
  name: List products
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  body:
    query: |-
      query {
        products(page: { first: 10 }) {
          id
          name
          price
          legacyCode
        }
      }
    variables: |-
      {}
  auth: inherit
