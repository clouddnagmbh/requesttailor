info:
  name: Search
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  body:
    query: |-
      query {
        search(text: "a") {
          ... on Category {
            label
          }
          ... on Product {
            name
          }
        }
      }
    variables: |-
      {}
  auth: inherit
