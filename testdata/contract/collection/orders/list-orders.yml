info:
  name: List orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/orders?limit=10"
  params:
    - name: limit
      value: "10"
      type: query
  headers:
    - name: X-Tenant
      value: "{{tenant}}"
    - name: Accept
      value: application/json
