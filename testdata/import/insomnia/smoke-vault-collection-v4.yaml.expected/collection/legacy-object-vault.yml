info:
  name: legacy-object-vault
  type: http
  seq: 4

http:
  method: GET
  url: localhost:4010/
  headers:
    - name: Content-Type
      value: text/plain
    - name: User-Agent
      value: insomnia/10.2.1-beta.1
  body:
    type: text
    data: |-
      {{vault.secret}}
      {{vault.v1}}
  auth:
    type: apikey
    key: ""
    value: ""
    placement: header

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log('pre');
        console.log(insomnia.variables.get('vault').v2)
        console.log(insomnia.vault.get('foo'));
    - type: after-response
      code: |-
        console.log('after');
        console.log(insomnia.vault.get('hello'));
