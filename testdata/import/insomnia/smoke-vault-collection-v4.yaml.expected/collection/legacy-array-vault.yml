info:
  name: legacy-array-vault
  type: http
  seq: 2

http:
  method: GET
  url: localhost:4010/
  headers:
    - name: Content-Type
      value: text/plain
    - name: User-Agent
      value: insomnia/10.2.1-beta.1
  body:
    type: text
    data: |-
      {{vault.secret}}
      {{ _.vault[0] }}
  auth:
    type: apikey
    key: ""
    value: ""
    placement: header

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log('pre');
        console.log(insomnia.variables.get('vault')[1]);
        console.log(insomnia.vault.get('foo'));
    - type: after-response
      code: |-
        console.log('after');
        console.log(insomnia.vault.get('hello'));
