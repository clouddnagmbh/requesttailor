info:
  name: Orders
  type: folder
  seq: 1

request:
  headers:
    - name: X-Team
      value: shop
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://id.example.com/token
    credentials:
      clientId: shop
      clientSecret: typed-client-secret
      placement: basic_auth_header
    scope: orders
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
  variables:
    - name: region
      value: eu
  scripts:
    - type: before-request
      code: insomnia.environment.set('t', Date.now());
    - type: after-response
      code: |-
        const body = insomnia.response.json();
        insomnia.test('has id', () => insomnia.expect(body.id).to.exist);

docs: Order endpoints
