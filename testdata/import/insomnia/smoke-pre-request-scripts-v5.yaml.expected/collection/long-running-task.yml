info:
  name: Long running task
  type: http
  seq: 5

http:
  method: GET
  url: http://127.0.0.1:4010/echo
  headers:
    - name: User-Agent
      value: insomnia/8.6.1
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function printAfterDelay() {
            console.log("Delaying");
            await delay(3000);
            console.log("Delayed");
        }

        await printAfterDelay();
