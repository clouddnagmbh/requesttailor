info:
  name: get sendRequest error through callback and rejected await
  type: http
  seq: 13

http:
  method: GET
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let errFromCallback;
        await insomnia.sendRequest(
                'http://127.0.0.1:1/unreachable',
                (err, resp) => {
                    errFromCallback = err;
                }
            );
        console.log('errFromCallback: ' + String(errFromCallback));

        let errFromAwait;
        try {
            await insomnia.sendRequest('http://127.0.0.1:1/unreachable');
        } catch (e) {
            errFromAwait = e;
        }
        console.log('errFromAwait: ' + String(errFromAwait));
