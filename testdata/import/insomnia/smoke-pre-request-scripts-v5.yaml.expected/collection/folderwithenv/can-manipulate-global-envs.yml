info:
  name: can manipulate global envs
  type: http
  seq: 21

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "setByScript": "{{setByScript}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: insomnia.globals.set('setByScript', 'setByScript');
