info:
  name: insomnia.request auth manipulation (basic)
  type: http
  seq: 17

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        insomnia.request.auth.update(
            {
                type: 'basic',
                basic: [
                        {key: 'username', value: 'myName'},
                        {key: 'password', value: 'myPwd'},
                ],
            },
            'basic'
        );
