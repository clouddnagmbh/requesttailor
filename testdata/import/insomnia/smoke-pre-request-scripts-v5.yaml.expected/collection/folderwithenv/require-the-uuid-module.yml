info:
  name: require the uuid module
  type: http
  seq: 12

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "uuid": "{{uuid}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = require('uuid');
        insomnia.environment.set('uuid', uuid.NIL);
