info:
  name: eval() works in script
  type: http
  seq: 9

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "evalResult": {{evalResult}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const evalResult = eval('8+8');
        insomnia.environment.set('evalResult', evalResult);
