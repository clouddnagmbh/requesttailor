info:
  name: insomnia.request auth manipulation (bearer)
  type: http
  seq: 19

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        insomnia.request.auth.update(
            {
                type: 'bearer',
                bearer: [
                        {key: 'token', value: 'tokenValue'},
                        {key: 'prefix', value: 'CustomTokenPrefix'},
                ],
            },
            'bearer'
        );
