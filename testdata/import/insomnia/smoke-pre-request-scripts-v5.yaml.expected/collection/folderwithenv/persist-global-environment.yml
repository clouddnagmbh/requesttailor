info:
  name: persist global environment
  type: http
  seq: 4

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log('globals ' + insomnia.globals.get('__env_source'));
        console.log('baseGlobals ' + insomnia.baseGlobals.get('__env_source'));
        insomnia.globals.set('__fromGlobals', 'selectedGlobal');
        insomnia.baseGlobals.set('__fromBaseGlobals', 'selectedBaseGlobal');
