info:
  name: not return until all Promise settled
  type: http
  seq: 23

http:
  method: POST
  url: http://127.0.0.1:4010/echo
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "asyncTaskDone": {{asyncTaskDone}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        new Promise(resolve => {
          setTimeout(() => {
            insomnia.environment.set("asyncTaskDone", true);
            resolve();
          }, 500)
        });
