info:
  name: GraphQL request with number
  type: graphql
  seq: 3

graphql:
  method: POST
  url: localhost:4010/graphqlTest
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: "query($inputVar: Int) { echoNum(intVar: $inputVar)}"
    variables: '"{ \"inputVar\": {{intVar}} }"'
  auth: inherit
