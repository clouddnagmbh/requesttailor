info:
  name: GraphQL request with variables
  type: graphql
  seq: 1

graphql:
  method: POST
  url: localhost:4010/graphqlTest
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      query($vars: VarsInput) {
      	echoVars(vars: $vars) {
      		stringVar 
      		intVar
      	}
      }
    variables: |-
      {
        "vars": {
          "stringVar": "3",
          "intVar": 3
        }
      }
  auth: inherit
