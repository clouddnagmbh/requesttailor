info:
  name: List users
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/users?active=true&page={{page_size}}"
  params:
    - name: active
      value: "true"
      type: query
    - name: page
      value: "{{page_size}}"
      type: query
      description: page number
    - name: sort
      value: name
      type: query
      disabled: true
  headers:
    - name: Accept
      value: application/json
    - name: X-Off
      value: "1"
      disabled: true
    - name: X-Request-Id
      value: "{% uuid 'v4' %}"
  auth: inherit

settings:
  encodeUrl: false
  followRedirects: false

docs: Lists users.
