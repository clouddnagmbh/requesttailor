  url: http://127.0.0.1:4010/oidc/me
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: http://127.0.0.1:4010/oidc/token
    credentials:
      clientId: resource_owner
      clientSecret: secret
      placement: basic_auth_header
    resourceOwner:
      username: foo
      password: bar
    scope: openid
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
