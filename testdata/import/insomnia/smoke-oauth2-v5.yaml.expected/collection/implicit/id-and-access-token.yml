info:
  name: ID and Access Token
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:4010/oidc/me
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: http://127.0.0.1:4010/oidc/auth
    callbackUrl: http://127.0.0.1:4010/callback
    credentials:
      clientId: implicit
    scope: openid
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
