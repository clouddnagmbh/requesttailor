info:
  name: Client Credentials
  type: http
  seq: 4

http:
  method: GET
  url: http://127.0.0.1:4010/oidc/client-credential
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: http://127.0.0.1:4010/oidc/token
    credentials:
      clientId: client_credentials
      clientSecret: secret
      placement: basic_auth_header
    scope: openid
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
