type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: Lossless v5
meta:
  id: wrk_lossless
collection:
  - name: Items
    meta:
      id: fld_items
      sortKey: 1
    children:
      - url: "{{ _.base_url }}/items"
        name: List items
        meta:
          id: req_list
          sortKey: 1
        method: GET
        headers:
          - name: Accept
            value: application/json
      - url: "{{ _.base_url }}/items"
        name: Add item
        meta:
          id: req_add
          sortKey: 2
        method: POST
        body:
          mimeType: application/json
          text: '{"name": "pen"}'
        authentication:
          type: basic
          username: "{{ _.user }}"
          password: "{{ _.password }}"
environments:
  name: Base Environment
  meta:
    id: env_base
  data:
    base_url: https://items.example.com
    user: alice
  subEnvironments:
    - name: Local
      meta:
        id: env_local
        sortKey: 1
      data:
        base_url: http://localhost:3000
