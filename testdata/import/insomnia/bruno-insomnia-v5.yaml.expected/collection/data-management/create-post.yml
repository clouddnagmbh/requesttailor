info:
  name: Create Post
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/posts"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
    - name: User-Agent
      value: insomnia/10.3.1
  body:
    type: json
    data: |-
      {
        "title": "Test Post",
        "content": "This is a test post content",
        "author": "Test Author"
      }
  auth: inherit
