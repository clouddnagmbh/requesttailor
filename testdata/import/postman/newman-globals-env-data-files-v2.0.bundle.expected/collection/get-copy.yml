info:
  name: GET copy
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/get?global={{global}}&env={{env}}&data={{data}}"
  params:
    - name: global
      value: "{{global}}"
      type: query
    - name: env
      value: "{{env}}"
      type: query
    - name: data
      value: "{{data}}"
      type: query
  body:
    type: multipart-form
    data: []
  auth: inherit

docs: Similar to postman-echo.com/get. Return GET data.
