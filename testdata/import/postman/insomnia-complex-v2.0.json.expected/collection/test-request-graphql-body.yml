info:
  name: Test Request GraphQL Body
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{base_url}}/graphql/"
  body:
    query: |
      mutation loginUser($username: String!, $password: String!) {
        login(username: $username, password: $password) {
          token
          status {
            success
          }
        }
      }
    variables: |-
      {
          "password": "{{password}}",
          "username": "{{username}}"
      }
  auth: inherit

