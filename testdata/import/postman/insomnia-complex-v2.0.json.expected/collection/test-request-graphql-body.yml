info:
  name: Test Request GraphQL Body
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/graphql/"
  body:
    type: json
    data: |-
      {
        "query": "mutation loginUser($username: String!, $password: String!) {\n  login(username: $username, password: $password) {\n    token\n    status {\n      success\n    }\n  }\n}\n",
        "variables": {
          "password": "{{password}}",
          "username": "{{username}}"
        }
      }
  auth: inherit

