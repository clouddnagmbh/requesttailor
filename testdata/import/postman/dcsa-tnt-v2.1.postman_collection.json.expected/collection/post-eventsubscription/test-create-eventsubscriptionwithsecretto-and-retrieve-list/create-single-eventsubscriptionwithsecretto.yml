info:
  name: create single EventSubscriptionWithSecretTO
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}{{TNT_CONTEXT_PATH}}/event-subscriptions"
  body:
    type: json
    data: "{\r

      \    \"callbackUrl\": \"http://test.me/event-subscription-callback-url\",\r

      \    \"documentReference\": \"test-docRef\",\r

      \    \"equipmentReference\": \"test-equipRef\",\r

      \    \"transportCallReference\": \"test-transportCallRef\",\r

      \    \"vesselIMONumber\": \"1234567\",\r

      \    \"carrierExportVoyageNumber\": \"test-carrierExportVoyageNumber\",\r

      \    \"universalExportVoyageReference\": \"12AZN\",\r

      \    \"carrierServiceCode\": \"csc34\",\r

      \    \"universalServiceReference\": \"SR00001D\",\r

      \    \"eventTypes\": [\r

      \        \"EQUIPMENT\",\r

      \        \"SHIPMENT\"\r

      \    ],\r

      \    \"shipmentEventTypeCodes\": [\r

      \        \"RECE\",\r

      \        \"APPR\"\r

      \    ],\r

      \    \"documentTypeCodes\": [\r

      \        \"ARN\",\r

      \        \"CAS\",\r

      \        \"BKG\"\r

      \    ],\r

      \    \"transportEventTypeCodes\": [\r

      \        \"DEPA\"\r

      \    ],\r

      \    \"equipmentEventTypeCodes\": [\r

      \        \"LOAD\",\r

      \        \"DISC\"\r

      \    ],\r

      \    \"secret\": \"dmVyeSBzZWNyZXQgc2VjcmV0IHRoYXQgaXMgc28gc2VjcmV0\",\r

      \    \"unlocationCode\": \"UNLoc\"\r

      }"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: "const schema = pm.collectionVariables.get(\"EVENT_SUBSCRIPTION_SCHEMA\");\r

        const schemaObject = JSON.parse(schema);\r

        \r

        const parsedBody = pm.response.json();\r

        pm.collectionVariables.set(\"SUBSCRIPTION_ID\", parsedBody.subscriptionID);\r

        \r

        pm.request.body.raw[\"secret\"] // delete secret before setting to compare in NEXT TEST\r

        pm.collectionVariables.set(\"POST_BODY\", pm.request.body.raw) // set body\r

        \r

        \r

        pm.test(\"Status code is 201\", () => {\r

        \    pm.response.to.have.status(201);\r

        });\r

        pm.test('Schema is valid', () => {\r

        \    pm.response.to.have.jsonSchema(schemaObject);\r

        });"
