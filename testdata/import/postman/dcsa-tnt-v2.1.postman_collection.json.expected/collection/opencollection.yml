                  },
                  "type": {
                    "type": "string",
                    "description": "The type of seal. This attribute links to the Seal Type ID defined in the Seal Type reference data entity.\n- KLP (Keyless padlock)\n- BLT (Bolt)\n- WIR (Wire)\n",
                    "enum": [
                      "KLP",
                      "BLT",
                      "WIR"
                    ]
                  }
                }
              }
            }
          }
        }
