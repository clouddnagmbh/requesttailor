info:
  name: OAuth 2
  type: http
  seq: 4

http:
  method: GET
  url: https://example.com/oauth2
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://auth.example.com/authorize
    accessTokenUrl: https://auth.example.com/token
    callbackUrl: https://app.example.com/cb
    credentials:
      clientId: "{{clientId}}"
      clientSecret: dummy-secret
      placement: basic_auth_header
    scope: read write
    pkce:
      disabled: false
      method: S256
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
