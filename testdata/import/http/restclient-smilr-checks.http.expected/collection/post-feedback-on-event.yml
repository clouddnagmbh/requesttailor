info:
  name: Post feedback on event
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:4000/api/feedback
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "event": "{{eventId}}",
        "topic": 1,
        "rating": 5,
        "comment": "Super amazing"
      }
