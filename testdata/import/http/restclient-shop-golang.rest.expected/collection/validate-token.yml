info:
  name: Validate-Token
  type: http
  seq: 3

http:
  method: GET
  url: "{{identity-api}}/validate-token"
  headers:
    - name: Content-Type
      value: application/json
    - name: authorization
      value: Bearer {{Token.response.body.access_token}}
    - name: accept
      value: application/json
