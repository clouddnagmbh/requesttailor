info:
  name: Get KSeF Token by Reference Number
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8082/token/retrieve?referenceNumber={{tokenReferenceNumber}}
  params:
    - name: referenceNumber
      value: "{{tokenReferenceNumber}}"
      type: query
  headers:
    - name: Authorization
      value: "{{token}}"
