info:
  name: Generate KSeF Token
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8082//token/generate
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "permissions": ["InvoiceRead"],
        "description": "Demo app"
      }
