info:
  name: sendMessage
  type: http
  seq: 3

http:
  method: POST
  url: "{{localUrl}}/messages?skipPhoneValidation=false"
  params:
    - name: skipPhoneValidation
      value: "false"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Basic {{localCredentials}}
  body:
    type: json
    data: |-
      {
          "message": "{{$localDatetime iso8601}}",
          "ttl": 600,
          "phoneNumbers": [
              "{{phone}}"
          ],
          "simNumber": {{$randomInt 1 3}},
          "withDeliveryReport": true
      }
