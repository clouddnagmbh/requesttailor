info:
  name: refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiBaseUrl}}/auth/refresh-token"
  headers:
    - name: Authorization
      value: Bearer {{jwt}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "refreshToken": "{{login.response.body.$.refreshToken}}"
      }
