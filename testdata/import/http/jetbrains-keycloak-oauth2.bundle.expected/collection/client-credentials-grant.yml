info:
  name: Client Credentials Grant
  type: http
  seq: 3

http:
  method: POST
  url: "{{ISSUER}}/protocol/openid-connect/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: text
    data: client_id={{CLIENT_WITH_CLIENT_CREDENTIALS_GRANT}}&client_secret={{SECRET}}&grant_type=client_credentials
