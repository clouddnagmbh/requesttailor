info:
  name: Obtain tokens via Resource Owner Password Credentials Grant Flow
  type: http
  seq: 1

http:
  method: POST
  url: "{{ISSUER}}/protocol/openid-connect/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: text
    data: client_id={{CLIENT_WITH_PASSWORD_GRANT}}&client_secret={{SECRET}}&username={{USER_USERNAME}}&password={{USER_PASSWORD}}&grant_type=password&scope=profile+openid
