info:
  name: certificate list query
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:8082/certificate/retrieve
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "certificateSerialNumbers": ["{{certificateSerialNumber}}"]
      }
