info:
  name: Get Stream by stream_id
  type: http
  seq: 3

http:
  method: GET
  url: "{{transmitterIssuer}}/ssf/streams?stream_id={{ stream_id}}"
  params:
    - name: stream_id
      value: "{{ stream_id}}"
      type: query
  headers:
    - name: Authorization
      value: Bearer {{transmitterToken}}
