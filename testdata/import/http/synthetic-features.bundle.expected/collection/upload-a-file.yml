info:
  name: Upload a file
  type: http
  seq: 3

http:
  method: PUT
  url: https://{{host}}/files/report.pdf
  headers:
    - name: Content-Type
      value: application/pdf
  body:
    type: file
    data:
      - filePath: ./report.pdf
        contentType: application/pdf
        selected: true
