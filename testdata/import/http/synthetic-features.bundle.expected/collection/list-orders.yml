info:
  name: List orders
  type: http
  seq: 2

http:
  method: GET
  url: https://{{host}}/orders?page=1&size=20
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "20"
      type: query
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}

settings:
  timeout: 5000
  followRedirects: false
