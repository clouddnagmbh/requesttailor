name: Production
variables:
  - name: baseUrl
    value: https://{{region}}.api.example.com/{{version}}
  - name: region
    value: eu
  - name: version
    value: v1
  - secret: true
    name: token
  - name: username
    value: ""
  - secret: true
    name: password
  - secret: true
    name: apiKey
  - name: clientId
    value: ""
  - secret: true
    name: clientSecret
