info:
  name: GET /oauth2/authorization-code
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/oauth2/authorization-code"
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://api.server.test/v1/auth
    accessTokenUrl: https://api.server.test/v1/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: read:something write:something
    pkce:
      disabled: true
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
