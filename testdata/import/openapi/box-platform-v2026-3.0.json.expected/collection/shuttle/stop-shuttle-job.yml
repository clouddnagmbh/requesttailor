info:
  name: Stop shuttle job
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/shuttle_jobs/:shuttle_job_id/stop"
  params:
    - name: shuttle_job_id
      value: 6a3ba68e810d9156194530a1
      type: path
      description: The unique identifier for the shuttle job.
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
  auth: inherit

docs: |-
  Stops a running shuttle job identified by its ID. Any work already in
  progress is allowed to finish before the job transitions to a stopped
  state.
