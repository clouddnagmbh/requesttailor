info:
  name: List shuttle mapping errors
  type: http
  seq: 36

http:
  method: GET
  url: "{{baseUrl}}/shuttle_mapping_errors?job_id=6a3ba68e810d9156194530a1"
  params:
    - name: job_id
      value: 6a3ba68e810d9156194530a1
      type: query
      description: The unique identifier of the shuttle job whose mapping errors to list.
    - name: marker
      value: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
      type: query
      description: |-
        Defines the position marker at which to begin returning results. This is
        used when paginating using marker-based pagination.

        This requires `usemarker` to be set to `true`.
      disabled: true
    - name: limit
      value: "1000"
      type: query
      description: The maximum number of items to return per page.
      disabled: true
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
  auth: inherit

docs: |-
  Returns a paginated list of mapping errors for a shuttle job. Only the latest
  record for each error is returned. The revision field identifies the mapping
  revision in which that error was generated.
