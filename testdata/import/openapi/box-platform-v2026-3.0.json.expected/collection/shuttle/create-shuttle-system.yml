info:
  name: Create shuttle system
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/shuttle_systems"
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "NYC File Server",
        "system_type": "windows"
      }
  auth: inherit

docs: |-
  Creates a new shuttle system. Only Windows agent systems can be created
  through the public API; other system types must be configured through the
  Shuttle application.
