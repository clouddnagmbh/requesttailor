info:
  name: Create shuttle path mapping
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/shuttle_path_mappings"
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "job_id": "6a3ba68e810d9156194530a1",
        "source": {
          "type": "shared_space",
          "space": "HR Team Site",
          "path": "/Shared Documents",
          "path_id": "sp-folder-001",
          "is_directory": true
        },
        "target": {
          "type": "account",
          "path": "/HR Migration",
