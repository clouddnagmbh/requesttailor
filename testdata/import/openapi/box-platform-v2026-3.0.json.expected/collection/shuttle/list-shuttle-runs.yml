info:
  name: List shuttle runs
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/shuttle_runs?job_id=6a3ba68e810d9156194530a1"
  params:
    - name: job_id
      value: 6a3ba68e810d9156194530a1
      type: query
      description: The unique identifier of the shuttle job whose runs to list.
    - name: marker
      value: JV9IRGZmieiBasejOG9yDCRNgd2ymoZIbjsxbJMjIs3kioVii
      type: query
      description: |-
        Defines the position marker at which to begin returning results. This is
        used when paginating using marker-based pagination.

        This requires `usemarker` to be set to `true`.
      disabled: true
    - name: limit
      value: "1000"
      type: query
      description: The maximum number of items to return per page.
      disabled: true
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
  auth: inherit

docs: |-
  Returns a paginated list of runs for the shuttle job identified by
  `job_id`.
