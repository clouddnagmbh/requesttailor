info:
  name: Create shuttle subject mapping
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/shuttle_subject_mappings"
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "job_id": "6a3ba68e810d9156194530a1",
        "discovered_subject_id": "6a3ba7c02ea17bc9461eeacf",
        "target": {
          "type": "user",
          "id": "12345678"
        }
      }
  auth: inherit

docs: |-
  Creates a subject mapping that connects a discovered source subject to a
  Box user or group for the given shuttle job.
