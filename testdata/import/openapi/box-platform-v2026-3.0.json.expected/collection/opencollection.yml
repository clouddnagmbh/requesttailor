opencollection: "1.0.0"

info:
  name: Box Platform API

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://account.box.com/api/oauth2/authorize
    accessTokenUrl: https://api.box.com/oauth2/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: root_readonly root_readwrite manage_app_users manage_managed_users manage_groups manage_webhook manage_enterprise_properties manage_data_retention manage_legal_hold
    pkce:
      disabled: true
  variables:
    - name: baseUrl
      value: https://api.box.com/2.0

docs: |-
  Version 2026.0

  [Box Platform](https://developer.box.com) provides functionality to provide access to content stored within [Box](https://box.com). It provides endpoints for basic manipulation of files and folders, management of users within an enterprise, as well as more complex topics such as legal holds and retention policies.

bundled: false
