info:
  name: Start Automate workflow
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/automate_workflows/:workflow_id/start"
  params:
    - name: workflow_id
      value: "12345"
      type: path
      description: The ID of the workflow.
  headers:
    - name: box-version
      value: "2026.0"
      description: Version header.
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "workflow_action_id": "981",
        "file_ids": [
          "123"
        ]
      }
  auth: inherit

docs: Starts an Automate workflow manually by using a workflow action ID and file IDs.
