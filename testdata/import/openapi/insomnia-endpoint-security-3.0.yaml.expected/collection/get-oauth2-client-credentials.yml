info:
  name: GET /oauth2/client-credentials
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/oauth2/client-credentials"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://api.server.test/v1/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: read:something write:something
