info:
  name: GET /oauth2/password
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/oauth2/password"
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: https://api.server.test/v1/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    resourceOwner:
      username: "{{username}}"
      password: "{{password}}"
    scope: read:something write:something
