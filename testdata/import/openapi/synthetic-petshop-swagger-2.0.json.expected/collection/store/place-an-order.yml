info:
  name: Place an order
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/store/orders"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "petId": 42,
        "quantity": 1
      }
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: https://auth.example.com/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    resourceOwner:
      username: "{{username}}"
      password: "{{password}}"
    scope: orders
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
