info:
  name: Inventory by status
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/store/inventory"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://auth.example.com/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
