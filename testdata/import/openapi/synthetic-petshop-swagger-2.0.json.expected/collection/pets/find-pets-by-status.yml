info:
  name: Find pets by status
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/pets?status="
  params:
    - name: status
      value: ""
      type: query
    - name: limit
      value: "20"
      type: query
      disabled: true
  headers:
    - name: X-Trace-Id
      value: ""
      disabled: true
  auth: inherit

examples:
  - name: 200 Pets
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "name": "Rex",
              "status": "available"
            }
          ]
