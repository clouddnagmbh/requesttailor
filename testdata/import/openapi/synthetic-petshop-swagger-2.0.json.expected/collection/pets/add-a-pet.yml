info:
  name: Add a pet
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/pets"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "kind": "dog",
        "name": "Rex",
        "tag": "string",
        "status": "available"
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://auth.example.com/authorize
    credentials:
      clientId: "{{clientId}}"
    scope: write:pets
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
