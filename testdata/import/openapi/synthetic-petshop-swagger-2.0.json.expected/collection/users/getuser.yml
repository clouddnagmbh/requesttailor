info:
  name: getUser
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/:username"
  params:
    - name: username
      value: ""
      type: path
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://auth.example.com/authorize
    accessTokenUrl: https://auth.example.com/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: admin
    pkce:
      disabled: true
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
