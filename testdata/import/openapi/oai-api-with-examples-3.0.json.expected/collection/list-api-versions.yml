info:
  name: List API versions
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

examples:
  - name: 200 foo
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "versions": [
              {
                "status": "CURRENT",
                "updated": "2011-01-21T11:33:21Z",
                "id": "v2.0",
                "links": [
                  {
                    "href": "http://127.0.0.1:8774/v2/",
                    "rel": "self"
                  }
                ]
              },
              {
                "status": "EXPERIMENTAL",
                "updated": "2013-07-23T11:33:21Z",
                "id": "v3.0",
                "links": [
                  {
                    "href": "http://127.0.0.1:8774/v3/",
                    "rel": "self"
                  }
                ]
              }
            ]
          }
  - name: 300 foo
    response:
      status: 300
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: '"{\n \"versions\": [\n       {\n         \"status\": \"CURRENT\",\n         \"updated\": \"2011-01-21T11:33:21Z\",\n         \"id\": \"v2.0\",\n         \"links\": [\n             {\n                 \"href\": \"http://127.0.0.1:8774/v2/\",\n                 \"rel\": \"self\"\n             }\n         ]\n     },\n     {\n         \"status\": \"EXPERIMENTAL\",\n         \"updated\": \"2013-07-23T11:33:21Z\",\n         \"id\": \"v3.0\",\n         \"links\": [\n             {\n                 \"href\": \"http://127.0.0.1:8774/v3/\",\n                 \"rel\": \"self\"\n             }\n         ]\n     }\n ]\n}\n"'
