info:
  name: Get museum hours
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/museum-hours"
  params:
    - name: startDate
      value: 2023-02-23
      type: query
      description: Starting date to retrieve future operating hours from. Defaults to today's date.
      disabled: true
    - name: page
      value: "2"
      type: query
      description: Page number to retrieve.
      disabled: true
    - name: limit
      value: "15"
      type: query
      description: Number of days per page.
      disabled: true
  auth: inherit

docs: Get upcoming museum operating hours.

