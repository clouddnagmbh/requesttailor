# SPDX-License-Identifier: Apache-2.0
# Every commit builds macOS, Windows, Linux and wasm32, checks the iOS build and runs the license gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown --locked

  ios:
    name: check (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain and iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --target aarch64-apple-ios --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: License headers
        run: node scripts/check-license-headers.mjs

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: cargo-deny (licenses, advisories, bans, sources)
        run: cargo deny --all-features check
      - run: npm ci --ignore-scripts
      - name: npm license check
        run: npm run check:licenses
      - name: Tests for the npm license check
        run: npm run test:scripts
      - name: Canaries (GPL dependencies must be rejected)
        run: ci/canary/run.sh

  # Single required status for branch protection.
  ci-ok:
    if: always()
    needs: [native, wasm, ios, lint, licenses]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
