# SPDX-License-Identifier: Apache-2.0
# Every commit builds macOS, Windows, Linux and wasm32, checks the iOS build, and runs the license,
# DCO, secret-scan and performance gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # What the Tauri desktop app needs to build on Linux (WebKitGTK 4.1 pulls in GTK 3 and libsoup 3).
  TAURI_LINUX_DEPS: libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev build-essential

jobs:
  native:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The workspace includes the desktop app (apps/desktop/src-tauri), which links WebKitGTK.
      - name: Desktop build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.TAURI_LINUX_DEPS }}
      # Debug builds of the workspace crash (access violation) on Windows as soon as wasmi runs
      # code (scripts, plugins) when wasmi is compiled at opt-level 2 or 3, which Cargo.toml
      # asks for to keep tests fast; opt-level 1 and release builds are fine (found by bisecting
      # the profile on the runner). Windows has no shipped debug build, so only this job lowers it.
      - name: wasmi at opt-level 1 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .cargo
          for p in wasmi wasmi_core wasmi_ir wasmi_collections; do
            printf '[profile.dev.package.%s]\nopt-level = 1\n\n' "$p" >> .cargo/config.toml
          done
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      # The example plugin for the wave 5 gate test in rt-desktop ("runs unchanged"); the
      # runners' preinstalled Node runs the build script.
      - name: Build the example plugin
        run: |
          rustup target add wasm32-unknown-unknown
          node scripts/build-plugins.mjs
      # --no-fail-fast: one broken test binary must not hide the failures of the others.
      - run: cargo test --workspace --locked --no-fail-fast

  # The desktop app as it ships (release, frontend embedded), without installer bundles.
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Desktop build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.TAURI_LINUX_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check and unit tests (TauriBackend)
        run: |
          npm run check -w apps/desktop
          npm test -w apps/desktop
      # `tauri build --no-bundle`: builds the frontend, then the release binary with it embedded.
      - name: Build the app
        run: npm run build -w apps/desktop -- --ci

  wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Native-only crates (CLI, test server, desktop app) are excluded; everything else must build
      # for the browser.
      - run: cargo build --workspace --exclude rt-cli --exclude rt-testserver --exclude rt-odata-testserver --exclude rt-desktop --exclude rt-git --target wasm32-unknown-unknown --locked

  ios:
    name: check (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain and iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      # The desktop app (Tauri, macOS/Windows/Linux) is not an iOS target.
      - run: cargo check --workspace --exclude rt-desktop --all-targets --target aarch64-apple-ios --locked

  # Parity gate: the same cases (testdata/conformance) against the native core and the WASM core
  # in headless Chrome. GitHub's ubuntu image ships Chrome and a matching chromedriver.
  conformance:
    name: conformance (native + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Native suite (core and the rt binary)
        run: cargo test -p rt-cli --test conformance --test cli --locked
      - name: Install wasm-bindgen-test-runner (version from Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          if ! wasm-bindgen-test-runner --version 2>/dev/null | grep -qxF "wasm-bindgen-test-runner $v"; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - name: Browser suite (headless Chrome)
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" scripts/conformance-wasm.sh

  # OAuth 2.0 acceptance (wave 5): the flows against a real provider, Keycloak with the test realm
  # in testdata/idp (port 8180). The tests skip visibly without RT_IDP_URL; here they must run.
  oauth-idp:
    name: OAuth 2.0 against Keycloak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start Keycloak (testdata/idp)
        run: testdata/idp/idp.sh start
      - name: Flows, token cache and refresh against the provider
        env:
          RT_IDP_URL: http://127.0.0.1:8180
        run: cargo test -p rt-core --test oauth2_idp --locked -- --nocapture
      - name: Keycloak log on failure
        if: failure()
        run: docker logs rt-idp 2>&1 | tail -n 200
      - name: Stop Keycloak
        if: always()
        run: testdata/idp/idp.sh stop

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Desktop build dependencies (clippy checks the desktop app)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.TAURI_LINUX_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: License headers
        run: node scripts/check-license-headers.mjs
      # Wave 7: the committed QuickJS engine (crates/rt-script/engine) must be what its source
      # and the pinned wasi-sdk build, byte for byte (downloads checked by SHA-256).
      - name: Script engine is reproducible
        run: node scripts/build-script-engine.mjs --check
      - name: Website (no third-party requests, links, budgets)
        run: node scripts/check-website.mjs

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: cargo-deny (licenses, advisories, bans, sources)
        run: cargo deny --all-features check
      - run: npm ci --ignore-scripts
      - name: npm license check
        run: npm run check:licenses
      - name: Tests for the npm license check
        run: npm run test:scripts
      - name: Script shims
        run: npm run test:shims
      - name: Canaries (GPL dependencies must be rejected)
        run: ci/canary/run.sh

  dco:
    name: dco sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every commit is signed off
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            spec="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            spec="$BEFORE..$GITHUB_SHA"
          else
            spec="$GITHUB_SHA"
          fi
          node scripts/check-dco.mjs "$spec"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  # Performance budgets (perf/budgets.toml, method in perf/README.md). Every OS measures the
  # desktop app as it ships (release build): cold start and idle memory. Linux also measures the
  # shared UI in Chrome: frame times over a 100 MB response and keystrokes to a sent request
  # (browser measurements, the same UI code on every OS). Each job fails on an exceeded budget;
  # `perf` merges all results (worst value per metric) and fails on an exceeded or missing one.
  perf-measure:
    name: perf (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, app: true, parts: "desktop,frames,keystrokes,diff,graph" }
          - { name: macos, os: macos-latest, app: true, parts: "desktop,diff" }
          - { name: windows, os: windows-latest, app: true, parts: "desktop,diff" }
          # Everything else the gate requires (perf/budgets.toml; `perf` below fails on a budget
          # no job measured). Native tools and the shared UI: one OS is enough, no desktop app.
          - { name: linux-tools, os: ubuntu-latest, app: false, parts: "consumers,compare,status,graph-large,snapshots,share,observe,watch,envcompare,checks,paging,ratelimit,inbox,lint,views,schemas,catalogue,trace,egress,journal,access,shrink,security,notebook,debugger" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: wasm32 target (web measurements)
        if: runner.os == 'Linux'
        run: rustup target add wasm32-unknown-unknown
      # WebKitGTK for the app, and a virtual display for its window.
      - name: Desktop build and run dependencies (Linux)
        if: runner.os == 'Linux' && matrix.app
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.TAURI_LINUX_DEPS }} xvfb
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tests of the measurement tools
        run: node --test "scripts/perf/*.test.mjs"
      - name: Install wasm-bindgen (version from Cargo.lock)
        if: runner.os == 'Linux'
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          if ! wasm-bindgen --version 2>/dev/null | grep -qxF "wasm-bindgen $v"; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - name: Build the desktop app (release, frontend embedded)
        if: matrix.app
        run: npm run build -w apps/desktop -- --ci
      - name: Build the core for the web app
        if: runner.os == 'Linux'
        run: node scripts/build-wasm.mjs
      - name: Recent collections against the real web backend
        if: matrix.name == 'linux'
        working-directory: apps/web
        run: npx playwright test --config e2e/recent/playwright.recent.config.ts
      - name: Measure (fails on an exceeded budget)
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.app }}" = "true" ]; then run="xvfb-run -a"; else run=""; fi
          $run node scripts/perf/run.mjs --only "${{ matrix.parts }}" --check
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.name }}
          path: |
            perf/results.json
            perf/report.json
          if-no-files-found: warn

  perf:
    name: perf budgets
    needs: perf-measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Tests of the budget check
        run: node --test scripts/check-perf-budgets.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: perf-*
          path: perf-results
      # Every OS must have delivered results; a missing one is a failure, not a skip.
      - name: Merge (worst value per metric) and check every budget
        run: |
          for os in linux macos windows linux-tools; do
            test -f "perf-results/perf-$os/results.json" || { echo "no results from $os"; exit 1; }
          done
          node scripts/perf/merge.mjs perf/results.json perf-results/perf-*/results.json
          node scripts/check-perf-budgets.mjs perf/results.json --require-all

  frontend:
    name: frontend (svelte, playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check (includes the Rust/TS contract fixtures)
        run: |
          npm run check -w apps/ui
          npm run check -w apps/web
      # The web app's real backend: the core as WebAssembly, and rt-testserver for the shell tests.
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen (version from Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          if ! wasm-bindgen --version 2>/dev/null | grep -qxF "wasm-bindgen $v"; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - name: Build the core for the web app, rt and rt-testserver
        run: |
          node scripts/build-wasm.mjs
          node scripts/build-plugins.mjs
          cargo build -p rt-cli -p rt-testserver --locked
      # After the core is built: the web unit tests also run against the real rt-wasm
      # (contract, rewrite), and skip those suites without it.
      - name: Unit tests
        run: |
          npm test -w apps/ui
          npm test -w apps/web
      # Uses the Google Chrome preinstalled on GitHub's ubuntu runners (channel "chrome").
      # Runs the UI tests (mock backend) and the shell tests (e2e/shells, real core). With
      # RT_BIN the tests against a real `rt agent` run too (companion, web Git push/pull via
      # `git http-backend`; git is preinstalled on the runners).
      # The tests' fixed ports (47xxx, 48xxx) lie inside Linux's default ephemeral range
      # (32768-60999); an outgoing connection can hold one (EADDRINUSE on the fake AI provider).
      - name: Keep the fixed test ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 32767"
      - name: Playwright
        env:
          RT_BIN: ${{ github.workspace }}/target/debug/rt
          RT_TESTSERVER_BIN: ${{ github.workspace }}/target/debug/rt-testserver
        run: npm run e2e -w apps/web
      - name: Keep the Playwright results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore

  # Plugin SDKs and the example plugin: the SDK's wasm32-only ABI module under clippy, the
  # plugins built to single .wasm modules (checked against API.md by the build script), the
  # TypeScript types against the Rust JSON, and the built example plugin on Node's WebAssembly.
  plugins:
    name: plugins (sdk, example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Clippy on wasm32 (the SDK's ABI module only builds there)
        run: cargo clippy -p rt-plugin-sdk -p rt-plugin-example --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the plugins (target/plugins)
        run: node scripts/build-plugins.mjs
      - name: TypeScript SDK (types against the Rust JSON, example plugin on Node's WebAssembly)
        run: |
          npm run check -w sdk/typescript
          npm test -w sdk/typescript
      - name: Keep the built plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: target/plugins/*.wasm
          if-no-files-found: error

  # rt run in pipelines (wave 7): the GitHub Action from github-action/ with a locally built rt
  # (`rt-path`, no download) against rt-testserver, on the smoke collection and on the imported
  # Postman collection of the wave 7 gate ("runs unchanged in CI after import"). The action's
  # shell logic has unit tests in scripts/github-action.test.mjs (npm run test:scripts).
  github-action:
    name: github action (rt run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build rt and rt-testserver
        run: cargo build -p rt-cli -p rt-testserver --locked
      - name: Start rt-testserver
        run: |
          target/debug/rt-testserver --port 47811 > "$RUNNER_TEMP/testserver.log" 2>&1 &
          for _ in $(seq 100); do grep -q listening "$RUNNER_TEMP/testserver.log" && exit 0; sleep 0.1; done
          cat "$RUNNER_TEMP/testserver.log"; exit 1
      - name: Smoke collection through the action
        id: smoke
        uses: ./github-action
        with:
          rt-path: ${{ github.workspace }}/target/debug/rt
          collection: github-action/test/collection
          environment: ci
          junit: reports/smoke-junit.xml
      - name: Outputs of the smoke run
        env:
          PASSED: ${{ steps.smoke.outputs.passed }}
          FAILED: ${{ steps.smoke.outputs.failed }}
          CODE: ${{ steps.smoke.outputs.exit-code }}
          JUNIT: ${{ steps.smoke.outputs.junit }}
        run: |
          echo "passed=$PASSED failed=$FAILED exit-code=$CODE junit=$JUNIT"
          [ "$PASSED" = 2 ] && [ "$FAILED" = 0 ] && [ "$CODE" = 0 ] && [ -s "$JUNIT" ]
      - name: Import the Postman collection of the wave 7 gate
        run: target/debug/rt import testdata/import/postman/scripts-gate.postman_collection.json --out "$RUNNER_TEMP/gate"
      - name: Run the imported collection through the action (wave 7 gate)
        id: gate
        uses: ./github-action
        with:
          rt-path: ${{ github.workspace }}/target/debug/rt
          collection: ${{ runner.temp }}/gate
          vars: baseUrl=http://127.0.0.1:47811
          junit: reports/gate-junit.xml
      - name: Every test of the scripts ran and passed
        env:
          PASSED: ${{ steps.gate.outputs.tests-passed }}
          FAILED: ${{ steps.gate.outputs.tests-failed }}
        run: |
          echo "tests passed=$PASSED failed=$FAILED"
          [ "$PASSED" -gt 0 ] && [ "$FAILED" = 0 ]
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-run-reports
          path: reports/
          if-no-files-found: warn

  # The Docker image (docker/Dockerfile) builds and runs; it is never pushed here (only the
  # release workflow pushes, by hand).
  docker:
    name: docker image (build, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f docker/Dockerfile --build-arg "REVISION=$GITHUB_SHA" -t rt:ci .
      - name: rt in the image, as a non-root user
        run: |
          docker run --rm rt:ci --version
          [ "$(docker image inspect rt:ci --format '{{.Config.User}}')" = nonroot ]
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rt run in the container against rt-testserver on the host
        run: |
          cargo build -p rt-testserver --locked
          target/debug/rt-testserver --port 47811 > "$RUNNER_TEMP/testserver.log" 2>&1 &
          for _ in $(seq 100); do grep -q listening "$RUNNER_TEMP/testserver.log" && break; sleep 0.1; done
          docker run --rm --network host -v "$PWD/github-action/test/collection:/work:ro" rt:ci \
            run . -e ci --reporter json > "$RUNNER_TEMP/run.json"
          jq -e '.summary.passed == 2 and .summary.failed == 0' "$RUNNER_TEMP/run.json"

  # Single required status for branch protection.
  ci-ok:
    if: always()
    needs: [native, desktop, wasm, ios, conformance, oauth-idp, lint, licenses, dco, secrets, perf-measure, perf, frontend, plugins, github-action, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
