# TEMPORARY (ci-fix branch): find out why wasmi crashes on Windows. Deleted before merge.
name: ci-debug
on:
  push:
    branches: [ci-fix-debug]
jobs:
  win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [threads-default, threads-minstack, linkstack, both]
    env:
      RUSTFLAGS: -D warnings ${{ (matrix.variant == 'linkstack' || matrix.variant == 'both') && '-C link-arg=/STACK:67108864' || '' }}
      RUST_MIN_STACK: ${{ (matrix.variant == 'threads-minstack' || matrix.variant == 'both') && '67108864' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
      - name: tests (default thread count)
        shell: bash
        run: |
          cargo test -p rt-script --test sandbox --locked 2>&1 | tail -12 || true
          cargo test -p rt-plugin --test host --locked 2>&1 | tail -12 || true
          cargo test -p rt-cli --test gate_w7 --locked 2>&1 | tail -12 || true
