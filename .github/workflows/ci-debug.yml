# TEMPORARY (ci-fix branch): find out why wasmi crashes on Windows. Deleted before merge.
name: ci-debug
on:
  push:
    branches: [ci-fix-debug]
jobs:
  win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [opt2, noassert, noassert-opt2]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
      - name: apply the variant
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            opt2)
              sed -i 's/^opt-level = 3/opt-level = 2/' Cargo.toml; git diff --stat ;;
            noassert)
              sed -i 's/^opt-level = 3/opt-level = 3\ndebug-assertions = false\noverflow-checks = false/' Cargo.toml; git diff | head -30 ;;
            noassert-opt2)
              sed -i 's/^opt-level = 3/opt-level = 2\ndebug-assertions = false\noverflow-checks = false/' Cargo.toml; git diff --stat ;;
            portable)
              sed -i 's/"auto-dispatch"\]/"auto-dispatch", "portable-dispatch"]/' crates/rt-script/Cargo.toml crates/rt-plugin/Cargo.toml
              git diff --stat ;;
            lowopt)
              sed -i 's/^opt-level = 3/opt-level = 1/' Cargo.toml; git diff --stat ;;
            noopt)
              sed -i 's/^opt-level = 3/opt-level = 0/' Cargo.toml; git diff --stat ;;
          esac
      - name: tests
        shell: bash
        run: |
          flags=""
          [ "${{ matrix.variant }}" = release ] && flags="--release"
          cargo test $flags -p rt-script --test sandbox --locked -- --nocapture --test-threads=1 2>&1 | tail -25 || true
          cargo test $flags -p rt-plugin --test host --locked -- --nocapture --test-threads=1 2>&1 | tail -25 || true
