# SPDX-License-Identifier: Apache-2.0
# Release: the signed and notarized macOS desktop app, `rt` binaries for macOS (universal) and
# Linux (x86_64, aarch64), SHA256SUMS with a GPG signature, uploaded to a DRAFT GitHub release.
# Nothing is published: the project owner reviews the draft and publishes it by hand
# (RELEASING.md).
#
# Distribution is the web app and Apple platforms. Windows and Linux use the web app or the
# CLI; there are no Windows or Linux app bundles here (CI still builds the app on every OS).
#
# - Tag push `v<version>`: everything signed; the tag must equal [workspace.package] version.
# - Run by hand (workflow_dispatch): a dry run that keeps the files as a workflow artifact and
#   creates no release; `signed` off builds without any secret.
# - Run by hand on a release tag with `push-image` on: only builds the Docker image
#   (docker/Dockerfile) for amd64 and arm64 and pushes it to ghcr.io. Never automatic.
#
# No updater: the app never checks for updates (product principle 2), so there is no update
# manifest and no updater key.
#
# Secrets: see RELEASING.md. A signed run checks them first and fails with the list of what is
# missing.
name: Release

on:
  push:
    # Versions only (v0.1.0, v0.2.0-rc.1): the major tag `v1` of the GitHub Action
    # (github-action/README.md) must not start a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign and notarize (needs every secret in RELEASING.md). Off: unsigned dry run."
        type: boolean
        default: true
      push-image:
        description: "Only build the Docker image and push it to ghcr.io (run on a release tag). Nothing else runs."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A tag push is always signed; a manual run follows its input.
  SIGNED: ${{ github.event_name == 'push' || inputs.signed }}

jobs:
  preflight:
    name: preflight (version, secrets)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version from Cargo.toml, checked against the tag
        id: version
        env:
          PUSH_IMAGE: ${{ inputs.push-image || false }}
        run: |
          version=$(awk -F'"' '/^\[workspace\.package\]/ { f = 1; next } /^\[/ { f = 0 } f && /^version *=/ { print $2; exit }' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::No [workspace.package] version in Cargo.toml"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version. Set [workspace.package] version in Cargo.toml (and \"version\" in apps/desktop/src-tauri/tauri.conf.json) in a commit, then tag v$version."
            exit 1
          fi
          # An image is only pushed from the release tag of this version.
          if [ "$PUSH_IMAGE" = "true" ] && { [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; }; then
            echo "::error::push-image runs only on the release tag v$version (Run workflow > Use workflow from > Tags > v$version), not on $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, signed: $SIGNED, push image: $PUSH_IMAGE"
      - name: Signing secrets are set
        if: env.SIGNED == 'true' && !inputs.push-image
        env:
          # Only whether each one is set reaches this step, never a value.
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAS_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE != '' }}
        run: |
          secrets=()
          need() { for n in "$@"; do v="HAS_$n"; [ "${!v}" = "true" ] || secrets+=("$n"); done; }

          # macOS: Developer ID certificate, and notarization with an Apple ID or an API key.
          need APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          if [ "$HAS_APPLE_API_KEY" = true ] || [ "$HAS_APPLE_API_ISSUER" = true ] || [ "$HAS_APPLE_API_KEY_P8" = true ]; then
            need APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8
          else
            need APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi

          # Checksums.
          need GPG_PRIVATE_KEY GPG_PASSPHRASE

          if [ ${#secrets[@]} -gt 0 ]; then
            echo "::error::Missing secrets (Settings > Secrets and variables > Actions > Secrets): ${secrets[*]}"
            echo "What each one is and where to get it: RELEASING.md. For a build without signing, run this workflow by hand with 'signed' off."
            exit 1
          fi
          echo "All signing secrets are set."

  # The desktop app (macOS only) and `rt` for macOS, universal (Apple silicon and Intel).
  macos:
    name: build (macos)
    needs: preflight
    if: ${{ !inputs.push-image }}
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: universal-apple-darwin
      BUNDLES: app,dmg
    steps:
      - uses: actions/checkout@v7
      # No build cache: release binaries are built from the tagged sources only.
      - name: Install pinned toolchain and targets
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      # The app bundles the OData plugin (target/plugins/odata.wasm).
      - name: Build the plugins
        run: node scripts/build-plugins.mjs

      # ------------------------------------------------------------------ signing material
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 24)
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Add it to the search list next to the existing keychains (one path per word).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY is not in the imported certificate. Identities found:"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi

      # Tauri configuration for this build, merged over apps/desktop/src-tauri/tauri.conf.json:
      # version, installer bundles on, and the signing settings.
      - name: Release configuration for Tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          node -e '
            const env = process.env;
            const config = { version: env.VERSION, bundle: { active: true, targets: env.BUNDLES.split(",") } };
            if (env.SIGNED === "true") {
              config.bundle.macOS = { signingIdentity: env.APPLE_SIGNING_IDENTITY, hardenedRuntime: true };
            }
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(config, null, 2));
          ' "$RUNNER_TEMP/tauri.release.json"
          cat "$RUNNER_TEMP/tauri.release.json"

      # ------------------------------------------------------------------ desktop app
      # Tauri signs, notarizes and staples the app and the disk image when the signing settings
      # and the APPLE_* notarization variables are present.
      - name: Build the desktop app
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.SIGNED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.SIGNED == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGNED == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGNED == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ env.SIGNED == 'true' && secrets.APPLE_API_KEY || '' }}
        run: |
          # Unset empty variables, so Tauri does not read "" as a setting.
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run tauri -w apps/desktop -- build --ci --target "$TARGET" --bundles "$BUNDLES" --config "$RUNNER_TEMP/tauri.release.json"

      # ------------------------------------------------------------------ rt (CLI)
      - name: Build rt (universal)
        run: |
          stage="$RUNNER_TEMP/rt-stage"
          mkdir -p "$stage"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p rt-cli --release --locked --target "$t"
          done
          lipo -create -output "$stage/rt" target/aarch64-apple-darwin/release/rt target/x86_64-apple-darwin/release/rt
          lipo -info "$stage/rt"
          "$stage/rt" --version
          cp LICENSE NOTICE "$stage/"
          echo "RT_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Sign rt
        if: env.SIGNED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --keychain "$RELEASE_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$RT_STAGE/rt"
          codesign --verify --strict --verbose=2 "$RT_STAGE/rt"

      # ------------------------------------------------------------------ collect
      - name: Collect the release files
        run: |
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          found=$(find "$bundle/dmg" -maxdepth 2 -type f -name '*.dmg')
          [ "$(printf '%s\n' "$found" | grep -c .)" = 1 ] || { echo "::error::expected one .dmg in $bundle/dmg, found: $found"; exit 1; }
          cp "$found" "$out/RequestTailor_${VERSION}_macos_universal.dmg"
          dir="rt_${VERSION}_macos_universal"
          mkdir "$RUNNER_TEMP/$dir" && cp "$RT_STAGE"/* "$RUNNER_TEMP/$dir/"
          ditto -c -k --keepParent "$RUNNER_TEMP/$dir" "$out/$dir.zip"
          ls -l "$out"

      # ------------------------------------------------------------------ notarize and verify
      # Tauri notarizes and staples the .app; the disk image and the rt archive are submitted
      # here. A bare binary cannot be stapled: Gatekeeper looks its ticket up online.
      - name: Notarize the disk image and rt
        if: env.SIGNED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          dmg="dist/RequestTailor_${VERSION}_macos_universal.dmg"
          codesign --force --timestamp --keychain "$RELEASE_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          for f in "$dmg" "dist/rt_${VERSION}_macos_universal.zip"; do
            xcrun notarytool submit "$f" "${auth[@]}" --wait --timeout 60m --output-format json | tee "$RUNNER_TEMP/notary.json"
            grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json" || { echo "::error::Notarization of $f was not accepted (xcrun notarytool log <id> shows why)"; exit 1; }
          done
          xcrun stapler staple "$dmg"

      - name: Verify signatures
        if: env.SIGNED == 'true'
        run: |
          app=$(find "target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          dmg="dist/RequestTailor_${VERSION}_macos_universal.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          codesign --verify --strict --verbose=2 "$RT_STAGE/rt"

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then rm -f "$APPLE_API_KEY_PATH"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  # `rt` for Linux: static musl binaries, so they run on any distribution (and in the
  # distroless image) without a glibc version requirement. Built on a native runner per
  # architecture; signed through SHA256SUMS.asc. For the GitHub Action and pipelines.
  cli-linux:
    name: build (rt, linux ${{ matrix.arch }})
    needs: preflight
    if: ${{ !inputs.push-image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain, the musl target and musl-gcc (for ring)
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build rt
        run: |
          # cc looks for <arch>-linux-musl-gcc; Ubuntu's musl-tools has musl-gcc for the host.
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build -p rt-cli --release --locked --target "$TARGET"
          bin="target/$TARGET/release/rt"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked' || { echo "::error::rt is not statically linked"; exit 1; }
          "$bin" --version
      - name: Collect the release file
        run: |
          dir="rt_${VERSION}_linux_${ARCH}"
          mkdir -p "$RUNNER_TEMP/$dir" dist
          cp "target/$TARGET/release/rt" LICENSE NOTICE "$RUNNER_TEMP/$dir/"
          tar -C "$RUNNER_TEMP" -czf "dist/$dir.tar.gz" "$dir"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: [preflight, macos, cli-linux]
    if: ${{ !inputs.push-image }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The GitHub Action (github-action/) downloads these names and checks them against
      # SHA256SUMS; keep both in step.
      - name: Every expected file is there
        working-directory: dist
        run: |
          for f in "RequestTailor_${VERSION}_macos_universal.dmg" "rt_${VERSION}_macos_universal.zip" \
                   "rt_${VERSION}_linux_x86_64.tar.gz" "rt_${VERSION}_linux_aarch64.tar.gz"; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Sign SHA256SUMS with the release key (GPG)
        if: env.SIGNED == 'true'
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$fpr" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --armor --export "$fpr" > release-key.asc
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          echo "Release key fingerprint: $fpr (must equal the one on website/download/ and in RELEASING.md)"
          rm -rf "$GNUPGHOME"
      # Dry run: keep everything as a workflow artifact, no release.
      - name: Keep the dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      # Tag push: a draft release. Publishing it is done by hand after review.
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=(--generate-notes)
          [ -f launch/RELEASE-NOTES.md ] && notes=(--notes-file launch/RELEASE-NOTES.md)
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "RequestTailor $VERSION" "${notes[@]}" "${pre[@]}" dist/*
          echo "Draft release created. Review it under Releases and publish it by hand."

  # ---------------------------------------------------------------------- Docker image
  # Only by hand: Run workflow on the release tag with push-image on. Each architecture is built
  # natively and pushed as <version>-<arch>; `image-manifest` joins them into <version> (and
  # `latest` for a version without a pre-release suffix).
  image:
    name: image (${{ matrix.arch }})
    needs: preflight
    if: ${{ inputs.push-image }}
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rt"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
            -t "$image:$VERSION-$ARCH" .
          docker run --rm "$image:$VERSION-$ARCH" --version | grep -qxF "rt $VERSION"
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"
          docker logout ghcr.io

  image-manifest:
    name: image (manifest)
    needs: [preflight, image]
    if: ${{ inputs.push-image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Multi-architecture tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rt"
          tags=(-t "$image:$VERSION")
          case "$VERSION" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"
          docker logout ghcr.io
