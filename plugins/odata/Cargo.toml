[package]
name = "rt-plugin-odata"
description = "RequestTailor: OData V2 and V4 plugin (metadata, query builder, CSRF, ETag, $batch, drafts, SAP system landscapes)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plain library, built into `target/plugins/odata.wasm` by `scripts/build-plugins.mjs` (see
# plugins/example/Cargo.toml). Uses only the public plugin API through rt-plugin-sdk.

[features]
default = ["plugin"]
# The plugin's `rt_call` export and manifest section on wasm32 (`rt_plugin_sdk::plugin!`). A
# crate that uses the model and parser as a library in its own wasm module turns it off
# (`default-features = false`), so the module neither exports `rt_call` nor imports the
# plugin host's `rt` functions.
plugin = []

[dependencies]
rt-plugin-sdk = { path = "../../crates/rt-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rt-format = { path = "../../crates/rt-format" }
# Acceptance tests of the writes run the hooks against the OData test server (native only).
rt-odata-testserver = { path = "testserver" }

[lints]
workspace = true
