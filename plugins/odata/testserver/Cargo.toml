[package]
name = "rt-odata-testserver"
description = "RequestTailor: local OData V2/V4 test server in the style of SAP Gateway, RAP and CAP (test infrastructure of the OData plugin only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rt-odata-testserver"
path = "src/main.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }

[lints]
workspace = true
