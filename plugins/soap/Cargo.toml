[package]
name = "rt-plugin-soap"
description = "SOAP 1.1/1.2 and WSDL: operations as requests, envelopes, WS-Security."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plain library, built into `target/plugins/soap.wasm` by `scripts/build-plugins.mjs` (see
# plugins/example/Cargo.toml). Uses only the public plugin API through rt-plugin-sdk.

[features]
default = ["plugin"]
# The plugin's `rt_call` export and manifest section on wasm32 (`rt_plugin_sdk::plugin!`).
# A crate that uses the parsers as a library turns it off (`default-features = false`).
plugin = []

[dependencies]
rt-plugin-sdk = { path = "../../crates/rt-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
rt-format = { path = "../../crates/rt-format" }
