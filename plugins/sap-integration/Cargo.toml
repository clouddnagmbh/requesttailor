[package]
name = "rt-plugin-sap-integration"
description = "SAP Integration Suite (Cloud Integration): flows, message processing logs and the OData API of the tenant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plain library, built into `target/plugins/sap-integration.wasm` by `scripts/build-plugins.mjs` (see
# plugins/example/Cargo.toml). Uses only the public plugin API through rt-plugin-sdk.

[dependencies]
rt-plugin-sdk = { path = "../../crates/rt-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
