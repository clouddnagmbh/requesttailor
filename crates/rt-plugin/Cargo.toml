[package]
name = "rt-plugin"
description = "RequestTailor: Plugin host (WASM) and SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["host"]
# The host side (WASM runtime, permission checks). The SDK uses the API types only:
# `rt-plugin = { default-features = false }`.
host = []

[dependencies]
rt-core = { path = "../rt-core" }
rt-format = { path = "../rt-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
