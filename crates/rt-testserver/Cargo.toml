[package]
name = "rt-testserver"
description = "RequestTailor: local HTTP test server for the conformance suite (test infrastructure only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rt-testserver"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
# HTTPS endpoint that requires a client certificate (wave 5, strand D).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
protox = { version = "0.10", default-features = false }
prost-reflect = "0.16"

[lints]
workspace = true
