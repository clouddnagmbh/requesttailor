[package]
name = "rt-format"
description = "RequestTailor: Reads and writes OpenCollection files; importers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
rt-core = { path = "../rt-core" }
# Loss reports and import formats are part of the app and CLI JSON.
serde = { version = "1", features = ["derive"] }
# Arguments of saved MCP tests (wave 8, `mcp_test`); already in the tree.
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Snapshots of the import corpus (loss reports as JSON).
serde_json = "1"
# Time limits in the hostile-input tests (std::time::Instant is not used in this workspace).
web-time = "1"

[lints]
workspace = true
