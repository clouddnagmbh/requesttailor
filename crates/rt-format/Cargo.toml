[package]
name = "rt-format"
description = "RequestTailor: Reads and writes OpenCollection files; importers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
rt-core = { path = "../rt-core" }
# Wave 18, strand H: compiled proto files as plain data, for the Protobuf contract. The same
# pure-Rust compiler (protox) the gRPC requests use; builds on every target.
rt-grpc = { path = "../rt-grpc" }
# Loss reports and import formats are part of the app and CLI JSON.
serde = { version = "1", features = ["derive"] }
# Arguments of saved MCP tests (wave 8, `mcp_test`); already in the tree.
serde_json = "1"
thiserror = "2"
# Wave 12, strand B: line-level three-way merge of files the model does not cover; already in
# the tree (rt-app), Apache-2.0, builds on every target.
similar = "3"
# OpenAPI import wizard: inflating `.zip` archives of multi-file specs. Already in the tree
# (Tauri, image crates), MIT OR Zlib OR Apache-2.0, pure Rust, builds on every target.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# The run wizard's `pattern` checks (contract); already in the tree (rt-core), MIT/Apache-2.0,
# builds on every target.
regex-lite = "0.1"

[dev-dependencies]
# Snapshots of the import corpus (loss reports as JSON).
serde_json = "1"
# Time limits in the hostile-input tests (std::time::Instant is not used in this workspace).
web-time = "1"

[lints]
workspace = true
