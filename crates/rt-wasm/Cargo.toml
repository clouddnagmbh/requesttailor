[package]
name = "rt-wasm"
description = "RequestTailor: The core compiled to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen, rlib for tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
rt-app = { path = "../rt-app" }
rt-core = { path = "../rt-core" }
rt-format = { path = "../rt-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The JS boundary exists only in the browser build; natively the crate is plain Rust so the
# workspace (and the iOS check) builds it without a JS runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[lints]
workspace = true
