[package]
name = "rt-plugin-sdk"
description = "RequestTailor: Rust SDK for writing plugins (compiled to wasm32-unknown-unknown)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Bodies and importer files are base64 in the plugin JSON.
base64 = "0.22"
# The API types only (no host). `rt-core` and `rt-format` for the types the API uses
# (request spec, note level, loss report); they build on wasm32.
rt-core = { path = "../rt-core" }
rt-format = { path = "../rt-format" }
rt-plugin = { path = "../rt-plugin", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
