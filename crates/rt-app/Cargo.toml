[package]
name = "rt-app"
description = "RequestTailor: the command layer behind the app (desktop and web), one implementation for both."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
# Request bodies of the AI providers (wave 8, `ai`) and the MCP client over Streamable HTTP
# (wave 8, `mcp_client`): bodies and the streamed answer of the app's `Transport` (both
# already in the tree via rt-core).
bytes = "1"
futures-core = "0.3"
# Line index of large response bodies (SIMD newline search).
memchr = "2"
rt-core = { path = "../rt-core" }
rt-format = { path = "../rt-format" }
# gRPC descriptors and JSON <-> protobuf (wave 8, strand B).
rt-grpc = { path = "../rt-grpc" }
rt-plugin = { path = "../rt-plugin" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: history entries (duration_ms) read back exactly as written.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Line diffs for the Git view (`git::text_diff`); Apache-2.0, pure Rust, builds on wasm32 and iOS.
similar = "3"
# JSONPath (RFC 9535) for filtering response bodies; MIT, builds on wasm32 and iOS.
serde_json_path = "0.7"
thiserror = "2"
# Timeouts of the secret managers' CLIs (`secret_sources`); std::time::Instant panics on wasm32.
web-time = "1"
# Loopback redirect URIs of the OAuth 2.0 browser step (`auth::loopback`); already in the tree.
url = "2"

# OS keychain for secret values (product principle 3). Native targets only: the web shell keeps
# secrets in encrypted browser storage. Linux uses the Secret Service over zbus (pure Rust, no
# libdbus needed at build time).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

# A fake token endpoint for `auth::fetch_token` (both already in the tree via rt-core).
[dev-dependencies]
bytes = "1"
futures-core = "0.3"

# Native-only test infrastructure for the send acceptance test (tests/workspace.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rt-testserver = { path = "../rt-testserver" }
tokio = { version = "1", features = ["rt", "net", "time"] }

[lints]
workspace = true
