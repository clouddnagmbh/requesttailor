[package]
name = "rt-cli"
description = "RequestTailor: CLI, companion service and MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rt"
path = "src/main.rs"

[dependencies]
# Small, no dependencies: keeps `rt` cold start lean (clap would add parsing and help machinery
# we do not need yet).
lexopt = "0.3"
# The secret scanner (`rt scan`) and external secret sources (`rt send`, `rt agent`), wave 5.
rt-app = { path = "../rt-app" }
rt-core = { path = "../rt-core" }
# OAuth 2.0 tokens in the keychain entries the desktop app uses, the loopback listener and
# the system browser (wave 5, strand C, `oauth.rs`).
rt-format = { path = "../rt-format" }
# gRPC descriptors and JSON <-> protobuf for `rt send` on gRPC requests (wave 8, strand B).
rt-grpc = { path = "../rt-grpc" }
rt-plugin = { path = "../rt-plugin" }
# The script sandbox (wave 7, `scripts.rs`).
rt-script = { path = "../rt-script" }
serde_json = "1"
# Current-thread runtime only; the native transport needs the I/O and timer drivers.
tokio = { version = "1", features = ["rt", "net", "time"] }

# Companion service `rt agent` (wave 3, strand G): a small HTTP/1.1 server on loopback.
base64 = "0.22"
bytes = "1"
# OS random source for pairing codes and tokens (already in the tree via ring).
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
url = "2"
web-time = "1"

[dev-dependencies]
rt-testserver = { path = "../rt-testserver" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[lints]
workspace = true
